<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications | AURA</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="js/auth.js"></script>
</head>

<body class="antialiased">
    <div id="app" class="flex h-screen overflow-hidden bg-slate-50 dark:bg-obsidian text-slate-900 dark:text-slate-300">
        <!-- Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay" onclick="window.closeMobileMenu()"></div>

        <!-- Sidebar -->
        <nav
            class="sidebar-mobile lg:translate-x-0 w-64 border-r border-slate-200 dark:border-white/5 bg-white/50 dark:bg-obsidian-light/50 backdrop-blur-xl flex flex-col justify-between z-40">
            <div>
                <div class="h-20 flex items-center justify-between px-6 border-b border-slate-200 dark:border-white/5">
                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary to-blue-500 shadow-[0_0_15px_rgba(45,212,191,0.5)] flex items-center justify-center text-obsidian font-bold cursor-pointer"
                            onclick="window.location.href='dashboard'">
                            A</div>
                        <span
                            class="ml-3 font-mono font-bold text-slate-800 dark:text-white tracking-widest cursor-pointer"
                            onclick="window.location.href='dashboard'">AURA</span>
                    </div>
                    <button class="lg:hidden text-slate-500" onclick="window.closeMobileMenu()">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <ul class="flex flex-col py-6 space-y-2 px-2">
                    <li><a href="dashboard"
                            class="flex items-center px-3 py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-white transition-colors group text-slate-500 dark:text-slate-400"><i
                                data-lucide="layout-dashboard"
                                class="w-5 h-5 group-hover:text-primary transition-colors"></i><span
                                class="ml-3 font-medium">Overview</span></a></li>
                    <li><a href="wallet"
                            class="flex items-center px-3 py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-white transition-colors group text-slate-500 dark:text-slate-400"><i
                                data-lucide="wallet"
                                class="w-5 h-5 group-hover:text-primary transition-colors"></i><span
                                class="ml-3 font-medium">Wallet</span></a></li>
                    <li><a href="analytics"
                            class="flex items-center px-3 py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-white transition-colors group text-slate-500 dark:text-slate-400"><i
                                data-lucide="bar-chart-2"
                                class="w-5 h-5 group-hover:text-primary transition-colors"></i><span
                                class="ml-3 font-medium">Analytics</span></a></li>
                    <li><a href="trade"
                            class="flex items-center px-3 py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-white transition-colors group text-slate-500 dark:text-slate-400"><i
                                data-lucide="zap" class="w-5 h-5 group-hover:text-primary transition-colors"></i><span
                                class="ml-3 font-medium">Trade</span></a></li>
                </ul>
            </div>
            <div class="p-4 border-t border-slate-200 dark:border-white/5 space-y-2">
                <a href="settings"
                    class="flex items-center px-3 py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-white/5 hover:text-slate-900 dark:hover:text-white transition-colors group text-slate-500 dark:text-slate-400"><i
                        data-lucide="settings" class="w-5 h-5 group-hover:text-primary transition-colors"></i><span
                        class="ml-3 font-medium">Settings</span></a>
                <button onclick="window.auth.logout()" data-auth="logout"
                    class="w-full flex items-center px-3 py-3 rounded-xl hover:bg-red-500/10 hover:text-red-500 text-slate-500 dark:text-slate-400 transition-colors group">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span class="ml-3 font-medium">Logout</span>
                </button>
            </div>
        </nav>

        <main class="flex-1 relative overflow-y-auto overflow-x-hidden p-6 lg:p-10">
            <div class="flex items-center mb-8">
                <button class="lg:hidden mr-4 p-2 text-slate-500 hover:text-primary transition-colors"
                    onclick="window.toggleMobileMenu()">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Notifications</h1>
            </div>

            <div class="space-y-4 max-w-3xl">
                <!-- Notification Item -->
                <div class="glass-panel p-4 rounded-2xl flex items-start gap-4">
                    <div class="p-2 rounded-full bg-primary/10 text-primary">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h4 class="text-slate-900 dark:text-white font-medium">Trade Executed</h4>
                            <span class="text-xs text-slate-500">2 min ago</span>
                        </div>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Successfully bought 0.05 BTC at
                            $45,230.50.</p>
                    </div>
                </div>

                <!-- Notification Item -->
                <div class="glass-panel p-4 rounded-2xl flex items-start gap-4">
                    <div class="p-2 rounded-full bg-blue-500/10 text-blue-500">
                        <i data-lucide="info" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h4 class="text-slate-900 dark:text-white font-medium">System Update</h4>
                            <span class="text-xs text-slate-500">2 hours ago</span>
                        </div>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Platform maintenance scheduled for
                            Feb 14, 2025.</p>
                    </div>
                </div>

                <!-- Notification Item -->
                <div class="glass-panel p-4 rounded-2xl flex items-start gap-4 opacity-75">
                    <div class="p-2 rounded-full bg-orange-500/10 text-orange-500">
                        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h4 class="text-slate-900 dark:text-white font-medium">Price Alert</h4>
                            <span class="text-xs text-slate-500">Yesterday</span>
                        </div>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Bitcoin (BTC) dropped below $44,000.
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="./main.js"></script>
</body>

</html>
